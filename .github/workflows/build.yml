name: Build and Release ESP32 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build in ESP-IDF Docker
        run: |
          docker run --rm -v "$PWD":/project -w /project espressif/idf:v5.1.4 bash -c "
            git config --global --add safe.directory /project
            . \$IDF_PATH/export.sh
            idf.py set-target esp32
            idf.py build
          "
          sudo chmod -R a+rw build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32-network-shield.bin

      - name: Update Release Assets (v0.5.0)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          files: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/esp32-network-shield.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
